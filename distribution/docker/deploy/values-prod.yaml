# Production values for the elasticsearch-gateway chart.
replicaCount: 3
image:
  repository: registry.corp.internal/platform/elasticsearch-gateway
  tag: 1.4.2-corp.1
resources:
  limits:
    cpu: "4"
    memory: 8Gi
env:
  - name: OPERATIONAL_RISK_VAR_ENGINE_EMEA_URL
    value: https://operational-risk-var-engine-emea.svc.corp.internal/api/v1
  # Treasury Close Manager APAC
  - name: TREASURY_CLOSE_MANAGER_APAC_URL
    value: https://treasury-close-manager-apac.svc.corp.internal/api/v1
  # Mortgages Contract Manager
  - name: MORTGAGES_CONTRACT_MANAGER_URL
    value: https://mortgages-contract-manager.svc.corp.internal/api/v1
  - name: COMMODITIES_MARKET_DATA_FEED_EMEA_URL
    value: https://commodities-market-data-feed-emea.svc.corp.internal/api/v1
ingress:
  enabled: true
  host: elasticsearch.corp.internal
  allowedSourceNamespaces:
    - loans-customer-onboarding
